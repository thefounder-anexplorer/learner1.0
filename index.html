<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Belajar HTML Harian — 5 Menit Sehari, Mahir dalam 30 Hari</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        /* ===== RESET & ROOT ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #2c3e50;
            --secondary: #3498db;
            --accent: #1abc9c;
            --success: #2ecc71;
            --warning: #f39c12;
            --danger: #e74c3c;
            --purple: #9b59b6;
            --dark: #1a252f;
            --light: #ecf0f1;
            --bg: #f0f4f8;
            --card: #ffffff;
            --text: #2c3e50;
            --text-muted: #7f8c8d;
            --border: #e1e8ed;
            --gradient-1: linear-gradient(135deg, #2c3e50, #1a252f);
            --gradient-2: linear-gradient(135deg, #3498db, #2980b9);
            --gradient-3: linear-gradient(135deg, #1abc9c, #16a085);
            --gradient-4: linear-gradient(135deg, #9b59b6, #8e44ad);
            --gradient-5: linear-gradient(135deg, #f39c12, #e67e22);
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
            transition: background 0.3s, color 0.3s;
        }

        body.dark {
            --bg: #0f1720;
            --card: #1a2733;
            --text: #ecf0f1;
            --text-muted: #95a5a6;
            --border: #2c3e50;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ===== HEADER ===== */
        header {
            padding: 40px 30px;
            margin-bottom: 30px;
            background: var(--gradient-1);
            color: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(44, 62, 80, 0.3);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 350px;
            height: 350px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 50%;
        }

        header .back-link {
            position: absolute;
            top: 20px;
            left: 25px;
            color: #fff;
            font-size: 0.95rem;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.15);
            padding: 8px 16px;
            border-radius: 30px;
            transition: all 0.3s;
            backdrop-filter: blur(4px);
            z-index: 2;
        }

        header .back-link:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateX(-3px);
        }

        header .theme-toggle {
            position: absolute;
            top: 20px;
            right: 25px;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: #fff;
            padding: 10px 14px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 2;
            font-size: 1rem;
        }

        header .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(20deg);
        }

        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 1;
        }

        h1 i {
            margin-right: 12px;
            color: #f1c40f;
        }

        .subtitle {
            font-size: 1.15rem;
            opacity: 0.92;
            max-width: 700px;
            margin: 0 auto 18px;
            position: relative;
            z-index: 1;
        }

        /* ===== PROGRESS BAR ===== */
        .progress-wrapper {
            max-width: 600px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .progress-bar {
            background: rgba(255, 255, 255, 0.15);
            height: 12px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .progress-fill {
            background: linear-gradient(90deg, #2ecc71, #1abc9c);
            height: 100%;
            width: 0%;
            transition: width 0.5s ease;
            border-radius: 10px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-top: 8px;
            opacity: 0.9;
        }

        /* ===== STATS ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card);
            border-radius: 14px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-3px);
        }

        .stat-card .stat-icon {
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .stat-card .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--primary);
        }

        body.dark .stat-card .stat-value {
            color: var(--text);
        }

        .stat-card .stat-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* ===== PHASE FILTER ===== */
        .phase-filter {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .phase-btn {
            padding: 10px 20px;
            border: 2px solid var(--border);
            background: var(--card);
            color: var(--text);
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .phase-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        .phase-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .phase-btn[data-phase="1"] { border-left: 4px solid #2ecc71; }
        .phase-btn[data-phase="2"] { border-left: 4px solid #3498db; }
        .phase-btn[data-phase="3"] { border-left: 4px solid #9b59b6; }
        .phase-btn[data-phase="4"] { border-left: 4px solid #e74c3c; }

        /* ===== DAY LIST ===== */
        .day-list {
            display: grid;
            gap: 14px;
            margin-bottom: 40px;
        }

        .day-card {
            background: var(--card);
            border-radius: 16px;
            padding: 20px 22px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
            border-left: 5px solid var(--secondary);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .day-card:hover {
            transform: translateX(4px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .day-card.completed {
            opacity: 0.75;
            background: linear-gradient(to right, rgba(46, 204, 113, 0.05), var(--card));
        }

        .day-card[data-phase="1"] { border-left-color: #2ecc71; }
        .day-card[data-phase="2"] { border-left-color: #3498db; }
        .day-card[data-phase="3"] { border-left-color: #9b59b6; }
        .day-card[data-phase="4"] { border-left-color: #e74c3c; }

        .day-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .day-number {
            background: var(--primary);
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.95rem;
            flex-shrink: 0;
        }

        .day-card.completed .day-number {
            background: var(--success);
        }

        .day-title {
            font-size: 1.15rem;
            font-weight: bold;
            color: var(--text);
        }

        .day-badge {
            font-size: 0.7rem;
            padding: 3px 12px;
            border-radius: 20px;
            font-weight: bold;
            margin-left: auto;
            white-space: nowrap;
        }

        .day-badge.phase-1 { background: #d5f5e3; color: #1e8449; }
        .day-badge.phase-2 { background: #d6eaf8; color: #1f618d; }
        .day-badge.phase-3 { background: #e8daef; color: #6c3483; }
        .day-badge.phase-4 { background: #fadbd8; color: #a93226; }

        body.dark .day-badge.phase-1 { background: #1e8449; color: #d5f5e3; }
        body.dark .day-badge.phase-2 { background: #1f618d; color: #d6eaf8; }
        body.dark .day-badge.phase-3 { background: #6c3483; color: #e8daef; }
        body.dark .day-badge.phase-4 { background: #a93226; color: #fadbd8; }

        .day-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .day-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 18px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--gradient-2);
            color: #fff;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(52, 152, 219, 0.3);
        }

        .btn-success {
            background: var(--gradient-3);
            color: #fff;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(26, 188, 156, 0.3);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text);
        }

        .btn-outline:hover {
            background: var(--light);
            transform: translateY(-2px);
        }

        body.dark .btn-outline:hover {
            background: #2c3e50;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            z-index: 1000;
            align-items: flex-start;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(4px);
            overflow-y: auto;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--card);
            border-radius: 20px;
            max-width: 820px;
            width: 100%;
            margin: 30px auto;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--light);
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1rem;
            color: var(--text);
            transition: all 0.3s;
            z-index: 3;
        }

        body.dark .modal-close {
            background: #2c3e50;
        }

        .modal-close:hover {
            background: var(--danger);
            color: #fff;
            transform: rotate(90deg);
        }

        .modal h2 {
            font-size: 1.6rem;
            color: var(--primary);
            margin-bottom: 8px;
            padding-right: 40px;
        }

        body.dark .modal h2 {
            color: #fff;
        }

        .modal .modal-subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .modal h3 {
            font-size: 1.1rem;
            margin: 22px 0 10px;
            color: var(--secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        body.dark .modal h3 {
            color: #5dade2;
        }

        .modal p {
            font-size: 0.95rem;
            line-height: 1.7;
            margin-bottom: 12px;
            color: var(--text);
        }

        .modal ul {
            margin-left: 20px;
            margin-bottom: 15px;
        }

        .modal ul li {
            font-size: 0.95rem;
            line-height: 1.8;
            color: var(--text);
        }

        .modal code {
            background: #f0f0f0;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.85em;
            color: #e74c3c;
        }

        body.dark .modal code {
            background: #2c3e50;
            color: #f39c12;
        }

        /* ===== CODE BLOCK — DIPERBAIKI ===== */
        .code-block {
            background: #1e2a35;
            color: #ecf0f1;
            padding: 14px 16px;
            border-radius: 10px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 0.8rem;
            line-height: 1.55;
            overflow-x: auto;
            overflow-y: auto;
            margin: 10px 0 15px;
            border-left: 4px solid var(--accent);
            white-space: pre;
            max-height: 320px;
            -webkit-overflow-scrolling: touch;
        }

        .code-block::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }
        .code-block::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
        }

        .code-block .tag { color: #e74c3c; }
        .code-block .attr { color: #f39c12; }
        .code-block .value { color: #2ecc71; }
        .code-block .comment { color: #7f8c8d; font-style: italic; }
        .code-block .keyword { color: #9b59b6; }
        .code-block .string { color: #1abc9c; }

        /* ===== EXERCISE BOX ===== */
        .exercise-box {
            background: linear-gradient(135deg, #fff9e6, #fef5e7);
            border-left: 4px solid var(--warning);
            padding: 15px 20px;
            border-radius: 10px;
            margin: 15px 0;
        }

        body.dark .exercise-box {
            background: linear-gradient(135deg, #3d3416, #2c2510);
            color: #f1c40f;
        }

        .exercise-box strong {
            color: var(--warning);
            display: block;
            margin-bottom: 6px;
        }

        .exercise-box p {
            color: inherit !important;
            font-size: 0.9rem;
        }

        /* ===== CODE EDITOR (LATIHAN) ===== */
        .practice-section {
            background: linear-gradient(135deg, #e8f8f5, #d1f2eb);
            border-radius: 14px;
            padding: 20px;
            margin: 20px 0 10px;
            border: 2px dashed #1abc9c;
        }

        body.dark .practice-section {
            background: linear-gradient(135deg, #0e3d36, #0a2b26);
            border-color: #16a085;
        }

        .practice-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            color: #0e6655;
            margin-bottom: 8px;
            font-size: 1rem;
        }

        body.dark .practice-title {
            color: #1abc9c;
        }

        .practice-title i {
            font-size: 1.2rem;
        }

        .practice-task {
            font-size: 0.9rem;
            color: var(--text);
            margin-bottom: 12px;
            line-height: 1.6;
        }

        .editor-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .editor-label span:first-child {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .code-editor {
            width: 100%;
            min-height: 140px;
            background: #1e2a35;
            color: #ecf0f1;
            border: 2px solid #34495e;
            border-radius: 10px;
            padding: 14px 16px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 0.8rem;
            line-height: 1.6;
            resize: vertical;
            outline: none;
            transition: border 0.3s;
            white-space: pre;
            overflow-x: auto;
            tab-size: 2;
        }

        .code-editor:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(26, 188, 156, 0.15);
        }

        .editor-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .editor-actions .btn {
            font-size: 0.8rem;
            padding: 8px 16px;
        }

        .btn-check {
            background: linear-gradient(135deg, #1abc9c, #16a085);
            color: #fff;
        }
        .btn-check:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(26, 188, 156, 0.35);
        }

        .btn-hint {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: #fff;
        }
        .btn-hint:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(243, 156, 18, 0.35);
        }

        .btn-reset {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text);
        }
        .btn-reset:hover {
            background: var(--light);
        }

        body.dark .btn-reset:hover {
            background: #2c3e50;
        }

        /* ===== FEEDBACK ===== */
        .feedback-box {
            margin-top: 12px;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.88rem;
            line-height: 1.6;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .feedback-box.show {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .feedback-box.success {
            background: #eafaf1;
            border-left: 4px solid #2ecc71;
            color: #196f3d;
        }

        body.dark .feedback-box.success {
            background: #0e3d2e;
            color: #a9dfbf;
        }

        .feedback-box.error {
            background: #fdedec;
            border-left: 4px solid #e74c3c;
            color: #922b21;
        }

        body.dark .feedback-box.error {
            background: #3d1714;
            color: #f5b7b1;
        }

        .feedback-box.hint {
            background: #fef9e7;
            border-left: 4px solid #f39c12;
            color: #7d6608;
        }

        body.dark .feedback-box.hint {
            background: #3d3416;
            color: #f9e79f;
        }

        .feedback-box strong {
            display: block;
            margin-bottom: 4px;
        }

        /* ===== PREVIEW ===== */
        .preview-box {
            background: #ffffff;
            border: 2px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            margin-top: 10px;
            color: #2c3e50;
            font-size: 0.9rem;
            min-height: 60px;
            overflow-x: auto;
        }

        .preview-box.dark-preview {
            background: #1a2733;
            color: #ecf0f1;
        }

        .preview-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* ===== FOOTER ===== */
        footer {
            margin-top: 40px;
            padding: 30px;
            background: var(--primary);
            color: #fff;
            border-radius: 15px;
            text-align: center;
        }

        .footer-logo {
            font-size: 2.5rem;
            color: var(--accent);
            margin-bottom: 10px;
        }

        .footer-text {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .subtitle { font-size: 1rem; }
            header { padding: 30px 20px; }
            header .back-link,
            header .theme-toggle {
                position: relative;
                top: 0;
                left: 0;
                right: 0;
                margin: 0 5px 10px 0;
                display: inline-block;
            }
            .day-actions { flex-direction: column; }
            .day-actions .btn { width: 100%; justify-content: center; }
            .modal { padding: 22px 18px; }
            .day-badge { margin-left: 0; }
            .editor-actions { flex-direction: column; }
            .editor-actions .btn { width: 100%; justify-content: center; }

            /* === KUNCI: KODE DI HP TIDAK JADI PARAGRAF BARU === */
            .code-block,
            .code-editor {
                font-size: 0.72rem;
                padding: 12px 12px;
                line-height: 1.5;
            }

            .modal h2 { font-size: 1.3rem; }
            .modal h3 { font-size: 1rem; }
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.6rem; }
            .stat-card { padding: 15px; }
            .stat-card .stat-value { font-size: 1.4rem; }
            .practice-section { padding: 14px; }
            .code-block,
            .code-editor {
                font-size: 0.68rem;
                padding: 10px;
            }
        }

        /* ===== ANIMASI ===== */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .day-card {
            animation: fadeInUp 0.4s ease backwards;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: rgba(52, 152, 219, 0.4);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(52, 152, 219, 0.6);
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- ===== HEADER ===== -->
        <header>
            <a href="index.html" class="back-link">

    <script>
        // ============================================================
        // KURIKULUM 30 HARI (dengan latihan editor)
        // ============================================================
        const curriculum = [
            // ===== FASE 1: DASAR (Hari 1-7) =====
            {
                day: 1, phase: 1, title: "Pengenalan HTML & Struktur Dasar",
                desc: "Kenalan dengan HTML, cara kerja browser, dan struktur dasar halaman web.",
                material: `
                    <h3>📖 Apa itu HTML?</h3>
                    <p>HTML (HyperText Markup Language) adalah bahasa untuk membuat struktur halaman web. Bayangkan HTML sebagai <em>kerangka</em> dari rumah — tanpa itu, rumah tidak berdiri.</p>
                    <h3>🏗️ Struktur Dasar</h3>
                    <p>Setiap halaman HTML memiliki struktur dasar seperti ini:</p>
                    <div class="code-block">
&lt;!DOCTYPE html&gt;
&lt;html&gt;
&lt;head&gt;
    &lt;title&gt;Judul Halaman&lt;/title&gt;
&lt;/head&gt;
&lt;body&gt;
    &lt;!-- Konten halaman di sini --&gt;
&lt;/body&gt;
&lt;/html&gt;
                    </div>
                    <p>Setiap tag HTML memiliki pasangan buka dan tutup. Tag pembuka seperti <code>&lt;p&gt;</code>, tag penutup seperti <code>&lt;/p&gt;</code>.</p>
                `,
                practice: {
                    task: "Tulis struktur dasar HTML dengan judul <strong>\"Halaman Pertamaku\"</strong> dan isi body dengan paragraf <strong>\"Halo, saya sedang belajar HTML!\"</strong>",
                    hint: "Gunakan urutan: &lt;!DOCTYPE html&gt; → &lt;html&gt; → &lt;head&gt; → &lt;title&gt; → &lt;/head&gt; → &lt;body&gt; → &lt;p&gt; → &lt;/body&gt; → &lt;/html&gt;",
                    validator: function(code) {
                        const c = code.toLowerCase().replace(/\s+/g, ' ');
                        const checks = [
                            { ok: c.includes('<!doctype html>'), msg: 'Awali dengan <code>&lt;!DOCTYPE html&gt;</code>' },
                            { ok: c.includes('<html'), msg: 'Tambahkan tag <code>&lt;html&gt;</code>' },
                            { ok: c.includes('<head'), msg: 'Tambahkan tag <code>&lt;head&gt;</code>' },
                            { ok: c.includes('<title'), msg: 'Tambahkan tag <code>&lt;title&gt;</code>' },
                            { ok: c.includes('halaman pertamaku'), msg: 'Judul harus berisi "Halaman Pertamaku"' },
                            { ok: c.includes('<body'), msg: 'Tambahkan tag <code>&lt;body&gt;</code>' },
                            { ok: c.includes('<p'), msg: 'Tambahkan paragraf dengan <code>&lt;p&gt;</code>' },
                            { ok: c.includes('halo, saya sedang belajar html!'), msg: 'Isi paragraf harus "Halo, saya sedang belajar HTML!"' }
                        ];
                        const failed = checks.filter(x => !x.ok);
                        if (failed.length === 0) return { success: true, msg: 'Sempurna! Struktur HTML kamu sudah benar. 🎉' };
                        return { success: false, msg: failed[0].msg };
                    }
                }
            },
            {
                day: 2, phase: 1, title: "Tag Teks: Heading & Paragraf",
                desc: "Belajar tag heading (h1-h6) dan paragraf untuk menulis konten.",
                material: `
                    <h3>📖 Tag Heading</h3>
                    <p>HTML memiliki 6 level heading, dari <code>&lt;h1&gt;</code> (paling besar) hingga <code>&lt;h6&gt;</code> (paling kecil).</p>
                    <div class="code-block">
&lt;h1&gt;Judul Utama&lt;/h1&gt;
&lt;h2&gt;Sub Judul&lt;/h2&gt;
&lt;h3&gt;Sub Sub Judul&lt;/h3&gt;
                    </div>
                    <h3>📝 Paragraf</h3>
                    <p>Tag <code>&lt;p&gt;</code> digunakan untuk membuat paragraf teks.</p>
                    <div class="code-block">
&lt;p&gt;Ini adalah paragraf pertama saya.&lt;/p&gt;
                    </div>
                `,
                practice: {
                    task: "Buat halaman dengan 1 heading utama (h1) berisi <strong>\"Tentang Saya\"</strong>, 1 sub-heading (h2) berisi <strong>\"Hobi\"</strong>, dan 1 paragraf berisi <strong>\"Saya suka belajar fisika.\"</strong>",
                    hint: "Gunakan &lt;h1&gt;Tentang Saya&lt;/h1&gt; lalu &lt;h2&gt;Hobi&lt;/h2&gt; lalu &lt;p&gt;...&lt;/p&gt;",
                    validator: function(code) {
                        const c = code.toLowerCase().replace(/\s+/g, ' ');
                        const checks = [
                            { ok: c.includes('<h1'), msg: 'Tambahkan heading <code>&lt;h1&gt;</code>' },
                            { ok: c.includes('tentang saya'), msg: 'Isi h1 harus "Tentang Saya"' },
                            { ok: c.includes('<h2'), msg: 'Tambahkan sub-heading <code>&lt;h2&gt;</code>' },
                            { ok: c.includes('hobi'), msg: 'Isi h2 harus "Hobi"' },
                            { ok: c.includes('<p'), msg: 'Tambahkan paragraf <code>&lt;p&gt;</code>' },
                            { ok: c.includes('saya suka belajar fisika.'), msg: 'Isi paragraf harus "Saya suka belajar fisika."' }
                        ];
                        const failed = checks.filter(x => !x.ok);
                        if (failed.length === 0) return { success: true, msg: 'Mantap! Struktur heading & paragraf kamu rapi. 👏' };
                        return { success: false, msg: failed[0].msg };
                    }
                }
            },
            {
                day: 3, phase: 1, title: "Memformat Teks: Bold, Italic, Underline",
                desc: "Gunakan tag formatting untuk menekankan teks penting.",
                material: `
                    <h3>📖 Tag Formatting Teks</h3>
                    <ul>
                        <li><code>&lt;strong&gt;</code> — teks tebal (penting)</li>
                        <li><code>&lt;em&gt;</code> — teks miring (penekanan)</li>
                        <li><code>&lt;u&gt;</code> — teks bergaris bawah</li>
                        <li><code>&lt;mark&gt;</code> — teks tersorot</li>
                        <li><code>&lt;del&gt;</code> — teks dicoret</li>
                    </ul>
                    <div class="code-block">
&lt;p&gt;Ini &lt;strong&gt;penting&lt;/strong&gt; dan ini &lt;em&gt;penekanan&lt;/em&gt;.&lt;/p&gt;
                    </div>
                `,
                practice: {
                    task: "Tulis satu paragraf: <strong>\"Saya suka minum kopi panas\"</strong> dengan kata <em>\"kopi\"</em> dibuat tebal dan kata <em>\"panas\"</em> dibuat miring.",
                    hint: "Gunakan &lt;strong&gt;kopi&lt;/strong&gt; dan &lt;em&gt;panas&lt;/em&gt; di dalam paragraf.",
                    validator: function(code) {
                        const c = code.toLowerCase();
                        const checks = [
                            { ok: c.includes('<p'), msg: 'Bungkus dengan tag <code>&lt;p&gt;</code>' },
                            { ok: c.includes('<strong>kopi</strong>') || c.includes('<b>kopi</b>'), msg: 'Kata "kopi" harus dibungkus <code>&lt;strong&gt;</code>' },
                            { ok: c.includes('<em>panas</em>') || c.includes('<i>panas</i>'), msg: 'Kata "panas" harus dibungkus <code>&lt;em&gt;</code>' },
                            { ok: c.includes('saya suka minum'), msg: 'Paragraf harus berisi "Saya suka minum"' }
                        ];
                        const failed = checks.filter(x => !x.ok);
                        if (failed.length === 0) return { success: true, msg: 'Keren! Formatting teks sudah kamu kuasai. ✨' };
                        return { success: false, msg: failed[0].msg };
                    }
                }
            },
            {
                day: 4, phase: 1, title: "Membuat Link (Hyperlink)",
                desc: "Menghubungkan halaman satu dengan halaman lain menggunakan tag <a>.",
                material: `
                    <h3>📖 Tag Link</h3>
                    <p>Tag <code>&lt;a&gt;</code> (anchor) digunakan untuk membuat link ke halaman lain.</p>
                    <div class="code-block">
&lt;a href="https://google.com"&gt;Kunjungi Google&lt;/a&gt;
                    </div>
                    <h3>🔗 Atribut Penting</h3>
                    <ul>
                        <li><code>href</code> — alamat tujuan link</li>
                        <li><code>target="_blank"</code> — buka di tab baru</li>
                    </ul>
                `,
                practice: {
                    task: "Buat 2 link: (1) ke <strong>https://google.com</strong> dengan teks <strong>\"Google\"</strong>, dan (2) ke <strong>https://youtube.com</strong> dengan teks <strong>\"YouTube\"</strong> yang dibuka di tab baru.",
                    hint: "Tambahkan target=&quot;_blank&quot; pada link YouTube.",
                    validator: function(code) {
                        const c = code.toLowerCase();
                        const checks = [
                            { ok: c.includes('href="https://google.com"') || c.includes("href='https://google.com'"), msg: 'Link Google harus ke https://google.com' },
                            { ok: c.includes('>google<') || c.includes('>google <'), msg: 'Teks link pertama harus "Google"' },
                            { ok: c.includes('href="https://youtube.com"') || c.includes("href='https://youtube.com'"), msg: 'Link YouTube harus ke https://youtube.com' },
                            { ok: c.includes('_blank'), msg: 'Link YouTube harus pakai target="_blank"' }
                        ];
                        const failed = checks.filter(x => !x.ok);
                        if (failed.length === 0) return { success: true, msg: 'Bagus! Link sudah kamu buat dengan benar. 🔗' };
                        return { success: false, msg: failed[0].msg };
                    }
                }
            },
            {
                day: 5, phase: 1, title: "Menampilkan Gambar",
                desc: "Sisipkan gambar ke halaman web dengan tag <img>.",
                material: `
                    <h3>📖 Tag Gambar</h3>
                    <p>Tag <code>&lt;img&gt;</code> adalah self-closing (tidak butuh penutup).</p>
                    <div class="code-block">
&lt;img src="gambar.jpg" alt="Deskripsi"&gt;
                    </div>
                    <h3>🖼️ Atribut Penting</h3>
                    <ul>
                        <li><code>src</code> — lokasi file gambar</li>
                        <li><code>alt</code> — teks alternatif jika gambar gagal dimuat</li>
                        <li><code>width</code> / <code>height</code> — ukuran gambar</li>
                    </ul>
                `,
                practice: {
                    task: "Tampilkan gambar dengan src <strong>https://picsum.photos/200</strong>, alt <strong>\"Foto random\"</strong>, dan lebar 200px.",
                    hint: "Gunakan &lt;img src=&quot;...&quot; alt=&quot;...&quot; width=&quot;200&quot;&gt;",
                    validator: function(code) {
                        const c = code.toLowerCase();
                        const checks = [
                            { ok: c.includes('<img'), msg: 'Tambahkan tag <code>&lt;img&gt;</code>' },
                            { ok: c.includes('src=') && c.includes('picsum.photos/200'), msg: 'src harus "https://picsum.photos/200"' },
                            { ok: c.includes('alt=') && c.includes('foto random'), msg: 'alt harus "Foto random"' },
                            { ok: c.includes('width=') && c.includes('200'), msg: 'Tambahkan width="200"' }
                        ];
                        const failed = checks.filter(x => !x.ok);
                        if (failed.length === 0) return { success: true, msg: 'Mantap! Gambar sudah tampil dengan benar. 📸' };
                        return { success: false, msg: failed[0].msg };
                    }
                }
            },
            {
                day: 6, phase: 1, title: "Membuat List (Bullet & Numbering)",
                desc: "Membuat daftar dengan unordered list dan ordered list.",
                material: `
                    <h3>📖 Unordered List (Bullet)</h3>
                    <div class="code-block">
&lt;ul&gt;
    &lt;li&gt;Item 1&lt;/li&gt;
    &lt;li&gt;Item 2&lt;/li&gt;
&lt;/ul&gt;
                    </div>
                    <h3>📖 Ordered List (Angka)</h3>
                    <div class="code-block">
&lt;ol&gt;
    &lt;li&gt;Langkah 1&lt;/li&gt;
    &lt;li&gt;Langkah 2&lt;/li&gt;
&lt;/ol&gt;
                    </div>
                `,
                practice: {
                    task: "Buat unordered list (bullet) berisi 3 makanan favorit: <strong>Nasi Goreng, Sate, Bakso</strong>.",
                    hint: "Gunakan &lt;ul&gt; sebagai pembungkus, lalu setiap item pakai &lt;li&gt;.",
                    validator: function(code) {
                        const c = code.toLowerCase();
                        const checks = [
                            { ok: c.includes('<ul'), msg: 'Gunakan tag <code>&lt;ul&gt;</code>' },
                            { ok: c.includes('<li'), msg: 'Tambahkan item dengan <code>&lt;li&gt;</code>' },
                            { ok: (c.match(/<li/g) || []).length >= 3, msg: 'Minimal 3 item <code>&lt;li&gt;</code>' },
                            { ok: c.includes('nasi goreng'), msg: 'Item harus berisi "Nasi Goreng"' },
                            { ok: c.includes('sate'), msg: 'Item harus berisi "Sate"' },
                            { ok: c.includes('bakso'), msg: 'Item harus berisi "Bakso"' }
                        ];
                        const failed = checks.filter(x => !x.ok);
                        if (failed.length === 0) return { success: true, msg: 'Mantap! List kamu sudah rapi. 📝' };
                        return { success: false, msg: failed[0].msg };
                    }
                }
            },
            {
                day: 7, phase: 1, title: "Tabel Sederhana",
                desc: "Buat tabel dengan baris dan kolom untuk data terstruktur.",
                material: `
                    <h3>📖 Struktur Tabel</h3>
                    <div class="code-block">
&lt;table&gt;
    &lt;tr&gt;
        &lt;th&gt;Nama&lt;/th&gt;
        &lt;th&gt;Umur&lt;/th&gt;
    &lt;/tr&gt;
    &lt;tr&gt;
        &lt;td&gt;Budi&lt;/td&gt;
        &lt;td&gt;25&lt;/td&gt;
    &lt;/tr&gt;
&lt;/table&gt;
                    </div>
                `,
                practice: {
                    task: "Buat tabel dengan header <strong>Nama</strong> dan <strong>Umur</strong>, lalu 1 baris data: <strong>Budi, 25</strong>.",
                    hint: "Gunakan &lt;table&gt;, &lt;tr&gt; untuk baris, &lt;th&gt; untuk header, &lt;td&gt; untuk data.",
                    validator: function(code) {
                        const c = code.toLowerCase();
                        const checks = [
                            { ok: c.includes('<table'), msg: 'Gunakan tag <code>&lt;table&gt;</code>' },
                            { ok: c.includes('<tr'), msg: 'Tambahkan baris dengan <code>&lt;tr&gt;</code>' },
                            { ok: c.includes('<th>nama</th>') || c.includes('<th> nama'), msg: 'Header harus berisi "Nama"' },
                            { ok: c.includes('<th>umur</th>') || c.includes('<th> umur'), msg: 'Header harus berisi "Umur"' },
                            { ok: c.includes('<td>budi</td>'), msg: 'Data harus berisi "Budi"' },
                            { ok: c.includes('<td>25</td>'), msg: 'Data harus berisi "25"' }
                        ];
                        const failed = checks.filter(x => !x.ok);
                        if (failed.length === 0) return { success: true, msg: 'Hebat! Kamu sudah bisa membuat tabel. 📊' };
                        return { success: false, msg: failed[0].msg };
                    }
                }
            },

            // ===== FASE 2: STRUKTUR (Hari 8-14) =====
            {
                day: 8, phase: 2, title: "Form & Input",
                desc: "Membuat form untuk menerima input dari pengguna.",
                material: `
                    <h3>📖 Form Dasar</h3>
                    <div class="code-block">
&lt;form&gt;
    &lt;label&gt;Nama:&lt;/label&gt;
    &lt;input type="text" name="nama"&gt;
    &lt;button type="submit"&gt;Kirim&lt;/button&gt;
&lt;/form&gt;
                    </div>
                `,
                practice: {
                    task: "Buat form dengan 1 input teks (name='nama') dan 1 tombol submit bertuliskan <strong>Kirim</strong>.",
                    hint: "Gunakan &lt;form&gt;, &lt;input type=&quot;text&quot;&gt;, dan &lt;button&gt;.",
                    validator: function(code) {
                        const c = code.toLowerCase();
                        const checks = [
                            { ok: c.includes('<form'), msg: 'Bungkus dengan <code>&lt;form&gt;</code>' },
                            { ok: c.includes('<input'), msg: 'Tambahkan <code>&lt;input&gt;</code>' },
                            { ok: c.includes('type="text"') || c.includes("type='text'"), msg: 'Input harus type="text"' },
                            { ok: c.includes('name="nama"') || c.includes("name='nama'"), msg: 'Input harus name="nama"' },
                            { ok: c.includes('<button'), msg: 'Tambahkan <code>&lt;button&gt;</code>' },
                            { ok: c.includes('kirim'), msg: 'Tombol harus bertuliskan "Kirim"' }
                        ];
                        const failed = checks.filter(x => !x.ok);
                        if (failed.length === 0) return { success: true, msg: 'Mantap! Form sudah kamu buat dengan benar. 📋' };
                        return { success: false, msg: failed[0].msg };
                    }
                }
            },
            {
                day: 9, phase: 2, title: "Semantic HTML",
                desc: "Gunakan tag semantic untuk struktur yang lebih bermakna.",
                material: `
                    <h3>📖 Tag Semantic</h3>
                    <ul>
                        <li><code>&lt;header&gt;</code> — kepala halaman</li>
                        <li><code>&lt;nav&gt;</code> — navigasi</li>
                        <li><code>&lt;main&gt;</code> — konten utama</li>
                        <li><code>&lt;article&gt;</code> — artikel mandiri</li>
                        <li><code>&lt;footer&gt;</code> — kaki halaman</li>
                    </ul>
                `,
                practice: {
                    task: "Buat struktur dengan <strong>&lt;header&gt;</strong>, <strong>&lt;main&gt;</strong>, dan <strong>&lt;footer&gt;</strong>. Isi main dengan paragraf <strong>\"Konten utama\"</strong>.",
                    hint: "Urutan: &lt;header&gt;...&lt;/header&gt; → &lt;main&gt;...&lt;/main&gt; → &lt;footer&gt;...&lt;/footer&gt;",
                    validator: function(code) {
                        const c = code.toLowerCase();
                        const checks = [
                            { ok: c.includes('<header'), msg: 'Tambahkan <code>&lt;header&gt;</code>' },
                            { ok: c.includes('<main'), msg: 'Tambahkan <code>&lt;main&gt;</code>' },
                            { ok: c.includes('konten utama'), msg: 'Isi main dengan "Konten utama"' },
                            { ok: c.includes('<footer'), msg: 'Tambahkan <code>&lt;footer&gt;</code>' }
                        ];
                        const failed = checks.filter(x => !x.ok);
                        if (failed.length === 0) return { success: true, msg: 'Hebat! Struktur semantic HTML kamu sudah benar. 🏗️' };
                        return { success: false, msg: failed[0].msg };
                    }
                }
            },
            {
                day: 10, phase: 2, title: "Meta Tag & SEO Dasar",
                desc: "Optimasi halaman untuk mesin pencari dan tampilan di berbagai perangkat.",
                material: `
                    <h3>📖 Meta Tag Penting</h3>
                    <div class="code-block">
&lt;meta charset="UTF-8"&gt;
&lt;meta name="viewport" content="width=device-width, initial-scale=1.0"&gt;
&lt;meta name="description" content="Deskripsi halaman"&gt;
                    </div>
                `,
                practice: {
                    task: "Tambahkan 3 meta tag ke dalam &lt;head&gt;: charset UTF-8, viewport, dan description dengan isi <strong>\"Belajar HTML\"</strong>.",
                    hint: "Letakkan meta tag di dalam &lt;head&gt;...&lt;/head&gt;",
                    validator: function(code) {
                        const c = code.toLowerCase();
                        const checks = [
                            { ok: c.includes('charset="utf-8"') || c.includes("charset='utf-8'"), msg: 'Tambahkan &lt;meta charset="UTF-8"&gt;' },
                            { ok: c.includes('name="viewport"'), msg: 'Tambahkan meta viewport' },
                            { ok: c.includes('name="description"'), msg: 'Tambahkan meta description' },
                            { ok: c.includes('belajar html'), msg: 'Description harus berisi "Belajar HTML"' }
                        ];
                        const failed = checks.filter(x => !x.ok);
                        if (failed.length === 0) return { success: true, msg: 'Keren! Meta tag SEO sudah kamu pasang. 🔍' };
                        return { success: false, msg: failed[0].msg };
                    }
                }
            },
            {
                day: 11, phase: 2, title: "Iframe — Menyisipkan Halaman Lain",
                desc: "Sisipkan video YouTube atau peta ke dalam halamanmu.",
                material: `
                    <h3>📖 Tag Iframe</h3>
                    <div class="code-block">
&lt;iframe src="https://www.youtube.com/embed/VIDEO_ID" width="560" height="315"&gt;&lt;/iframe&gt;
                    </div>
                `,
                practice: {
                    task: "Buat iframe dengan src <strong>https://www.example.com</strong>, width 400, dan height 300.",
                    hint: "Gunakan &lt;iframe src=&quot;...&quot; width=&quot;...&quot; height=&quot;...&quot;&gt;&lt;/iframe&gt;",
                    validator: function(code) {

                            { ok: c.includes('foreach'), msg: 'Gunakan <code>forEach</code>' },
                            { ok: c.includes('console.log'), msg: 'Gunakan <code>console.log</code>' }
                        ];
                        const failed = checks.filter(x => !x.ok);
                        if (failed.length === 0) return { success: true, msg: 'Keren! Array & loop sudah kamu kuasai. 🔁' };
                        return { success: false, msg: failed[0].msg };
                    }
                }
            },
            {
                day: 28, phase: 4, title: "Fetch API — Ambil Data",
                desc: "Ambil data dari server menggunakan JavaScript.",
                material: `
                    <h3>📖 Fetch API</h3>
                    <div class="code-block">
fetch("https://jsonplaceholder.typicode.com/posts/1")
    .then(response => response.json())
    .then(data => console.log(data))
    .catch(error => console.error(error));
                    </div>
                `,
                practice: {
                    task: "Gunakan fetch ke <strong>\"https://jsonplaceholder.typicode.com/posts/1\"</strong>, ubah ke JSON, dan console.log data-nya.",
                    hint: "fetch(url).then(r =&gt; r.json()).then(d =&gt; console.log(d));",
                    validator: function(code) {
                        const c = code.toLowerCase();
                        const checks = [
                            { ok: c.includes('fetch('), msg: 'Gunakan <code>fetch()</code>' },
                            { ok: c.includes('jsonplaceholder.typicode.com'), msg: 'URL harus jsonplaceholder' },
                            { ok: c.includes('.then'), msg: 'Gunakan <code>.then()</code>' },
                            { ok: c.includes('.json()'), msg: 'Ubah ke <code>.json()</code>' },
                            { ok: c.includes('console.log'), msg: 'Tampilkan dengan <code>console.log</code>' }
                        ];
                        const failed = checks.filter(x => !x.ok);
                        if (failed.length === 0) return { success: true, msg: 'Hebat! Fetch API sudah kamu kuasai. 🌐' };
                        return { success: false, msg: failed[0].msg };
                    }
                }
            },
            {
                day: 29, phase: 4, title: "LocalStorage",
                desc: "Simpan data di browser pengguna.",
                material: `
                    <h3>📖 LocalStorage</h3>
                    <div class="code-block">
localStorage.setItem("nama", "Budi");
const nama = localStorage.getItem("nama");
console.log(nama);
                    </div>
                `,
                practice: {
                    task: "Simpan nilai <strong>\"Budi\"</strong> ke localStorage dengan key <strong>\"nama\"</strong>, lalu ambil dan console.log.",
                    hint: "localStorage.setItem(&quot;nama&quot;, &quot;Budi&quot;); console.log(localStorage.getItem(&quot;nama&quot;));",
                    validator: function(code) {
                        const c = code.toLowerCase();
                        const checks = [
                            { ok: c.includes('localstorage.setitem'), msg: 'Gunakan <code>localStorage.setItem</code>' },
                            { ok: c.includes('"nama"') || c.includes("'nama'"), msg: 'Key harus "nama"' },
                            { ok: c.includes('"budi"') || c.includes("'budi'"), msg: 'Value harus "Budi"' },
                            { ok: c.includes('localstorage.getitem'), msg: 'Gunakan <code>localStorage.getItem</code>' },
                            { ok: c.includes('console.log'), msg: 'Tampilkan dengan <code>console.log</code>' }
                        ];
                        const failed = checks.filter(x => !x.ok);
                        if (failed.length === 0) return { success: true, msg: 'Mantap! LocalStorage sudah kamu kuasai. 💾' };
                        return { success: false, msg: failed[0].msg };
                    }
                }
            },
            {
                day: 30, phase: 4, title: "Project Akhir: Aplikasi To-Do List",
                desc: "Gabungkan HTML, CSS, dan JavaScript menjadi aplikasi nyata.",
                material: `
                    <h3>🏆 Project Akhir</h3>
                    <p>Buat aplikasi To-Do List dengan HTML + JS sederhana:</p>
                    <ul>
                        <li>Input teks untuk menambah tugas</li>
                        <li>Tombol tambah</li>
                        <li>Fungsi JavaScript untuk menambah item ke list</li>
                    </ul>
                `,
                practice: {
                    task: "Buat struktur To-Do List: input dengan id <strong>\"inputTugas\"</strong>, tombol dengan id <strong>\"btnTambah\"</strong>, dan ul dengan id <strong>\"daftarTugas\"</strong>.",
                    hint: "Gunakan &lt;input id=&quot;inputTugas&quot;&gt;, &lt;button id=&quot;btnTambah&quot;&gt;Tambah&lt;/button&gt;, &lt;ul id=&quot;daftarTugas&quot;&gt;&lt;/ul&gt;",
                    validator: function(code) {
                        const c = code.toLowerCase();
                        const checks = [
                            { ok: c.includes('id="inputtugas"') || c.includes("id='inputtugas'"), msg: 'Input harus id="inputTugas"' },
                            { ok: c.includes('id="btntambah"') || c.includes("id='btntambah'"), msg: 'Tombol harus id="btnTambah"' },
                            { ok: c.includes('id="daftartugas"') || c.includes("id='daftartugas'"), msg: 'UL harus id="daftarTugas"' },
                            { ok: c.includes('<ul'), msg: 'Gunakan <code>&lt;ul&gt;</code>' }
                        ];
                        const failed = checks.filter(x => !x.ok);
                        if (failed.length === 0) return { success: true, msg: '🎉 SELAMAT! Kamu telah menyelesaikan 30 hari belajar HTML! Kamu luar biasa!' };
                        return { success: false, msg: failed[0].msg };
                    }
                }
            }
        ];

        // ============================================================
        // STATE & STORAGE
        // ============================================================
        const STORAGE_KEY = 'belajar_html_progress';
        const DRAFT_KEY = 'belajar_html_draft_';

        function loadProgress() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                return data ? JSON.parse(data) : { completedDays: [] };
            } catch (e) {
                return { completedDays: [] };
            }
        }

        function saveProgress(progress) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
            } catch (e) {}
        }

        let progress = loadProgress();
        let currentFilter = 'all';

        // ============================================================
        // RENDER
        // ============================================================
        function render() {
            renderDays();
            updateStats();
            updateProgressBar();
        }

        function renderDays() {
            const dayList = document.getElementById('dayList');
            dayList.innerHTML = '';

            const filtered = currentFilter === 'all'
                ? curriculum
                : curriculum.filter(d => d.phase === parseInt(currentFilter));

            filtered.forEach((item, index) => {
                const isCompleted = progress.completedDays.includes(item.day);
                const card = document.createElement('div');
                card.className = `day-card ${isCompleted ? 'completed' : ''}`;
                card.setAttribute('data-phase', item.phase);
                card.style.animationDelay = `${index * 0.05}s`;

                const phaseName = { 1: 'Pemula', 2: 'Menengah', 3: 'Mahir', 4: 'Expert' }[item.phase];

                card.innerHTML = `
                    <div class="day-header">
                        <div class="day-number">${item.day}</div>
                        <div class="day-title">${item.title}</div>
                        <span class="day-badge phase-${item.phase}">${phaseName}</span>
                    </div>
                    <div class="day-desc">${item.desc}</div>
                    <div class="day-actions">
                        <button class="btn btn-primary" onclick="openModal(${item.day})">
                            <i class="fas fa-book-open"></i> Pelajari (5 menit)
                        </button>
                        <button class="btn ${isCompleted ? 'btn-outline' : 'btn-success'}"
                                onclick="toggleComplete(${item.day})">
                            <i class="fas ${isCompleted ? 'fa-undo' : 'fa-check'}"></i>
                            ${isCompleted ? 'Batal Selesai' : 'Tandai Selesai'}
                        </button>
                    </div>
                `;
                dayList.appendChild(card);
            });
        }

        function updateStats() {
            const totalDays = curriculum.length;
            const completed = progress.completedDays.length;
            const minutes = completed * 5;

            document.getElementById('statDays').textContent = completed;
            document.getElementById('statMinutes').textContent = minutes;

            let level = 'Pemula';
            if (completed >= 25) level = 'Expert';
            else if (completed >= 18) level = 'Mahir';
            else if (completed >= 10) level = 'Menengah';
            else if (completed >= 3) level = 'Pemula+';
            document.getElementById('statLevel').textContent = level;

            let streak = 0;
            for (let i = 1; i <= totalDays; i++) {
                if (progress.completedDays.includes(i)) streak++;
                else break;
            }
            document.getElementById('statStreak').textContent = streak;
        }

        function updateProgressBar() {
            const total = curriculum.length;
            const completed = progress.completedDays.length;
            const percent = Math.round((completed / total) * 100);

            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('progressText').textContent = `${completed} dari ${total} hari selesai`;
            document.getElementById('progressPercent').textContent = percent + '%';
        }

        // ============================================================
        // ACTIONS
        // ============================================================
        function toggleComplete(day) {
            const idx = progress.completedDays.indexOf(day);
            if (idx === -1) {
                progress.completedDays.push(day);
            } else {
                progress.completedDays.splice(idx, 1);
            }
            progress.completedDays.sort((a, b) => a - b);
            saveProgress(progress);
            render();
        }

        function openModal(day) {
            const item = curriculum.find(d => d.day === day);
            if (!item) return;

            const modal = document.getElementById('modalContent');
            const savedDraft = localStorage.getItem(DRAFT_KEY + day) || '';

            modal.innerHTML = `
                <button class="modal-close" onclick="closeModal()">
                    <i class="fas fa-times"></i>
                </button>
                <span class="day-badge phase-${item.phase}" style="margin-bottom:10px;display:inline-block;">
                    Hari ${item.day} — Fase ${item.phase}
                </span>
                <h2>${item.title}</h2>
                <p class="modal-subtitle">${item.desc}</p>
                <div class="modal-body">
                    ${item.material}

                    ${item.practice ? `
                        <div class="practice-section">
                            <div class="practice-title">
                                <i class="fas fa-keyboard"></i> Latihan Mengetik Kode
                            </div>
                            <p class="practice-task">${item.practice.task}</p>

                            <div class="editor-label">
                                <span><i class="fas fa-code"></i> Tulis kodemu di sini:</span>
                                <span id="charCount_${day}">0 karakter</span>
                            </div>
                            <textarea 
                                class="code-editor" 
                                id="editor_${day}"
                                spellcheck="false"
                                placeholder="<-- Ketik kode HTML kamu di sini... -->"
                                oninput="updateCharCount(${day})"
                            >${savedDraft}</textarea>

                            <div class="editor-actions">
                                <button class="btn btn-check" onclick="checkAnswer(${day})">
                                    <i class="fas fa-check-circle"></i> Periksa Jawaban
                                </button>
                                <button class="btn btn-hint" onclick="showHint(${day})">
                                    <i class="fas fa-lightbulb"></i> Bantuan
                                </button>
                                <button class="btn btn-reset" onclick="resetEditor(${day})">
                                    <i class="fas fa-redo"></i> Reset
                                </button>
                            </div>

                            <div class="feedback-box" id="feedback_${day}"></div>

                            <div class="preview-label" style="margin-top:14px;">
                                <i class="fas fa-eye"></i> Preview:
                            </div>
                            <div class="preview-box" id="preview_${day}">
                                <em style="color:#999;">Preview akan muncul di sini setelah kamu klik Periksa.</em>
                            </div>
                        </div>
                    ` : ''}
                </div>
                <div style="margin-top:20px;padding-top:20px;border-top:1px solid var(--border);display:flex;gap:10px;flex-wrap:wrap;">
                    <button class="btn btn-success" onclick="toggleComplete(${item.day}); closeModal();">
                        <i class="fas fa-check"></i> Tandai Selesai
                    </button>
                    <button class="btn btn-outline" onclick="closeModal()">
                        <i class="fas fa-times"></i> Tutup
                    </button>
                </div>
            `;

            document.getElementById('modalOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';

            // Auto-save saat user mengetik
            const editor = document.getElementById(`editor_${day}`);
            if (editor) {
                editor.addEventListener('input', () => {
                    localStorage.setItem(DRAFT_KEY + day, editor.value);
                });
                updateCharCount(day);
            }
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            document.body.style.overflow = '';
        }

        // ============================================================
        // EDITOR FUNCTIONS
        // ============================================================
        function updateCharCount(day) {
            const editor = document.getElementById(`editor_${day}`);
            const counter = document.getElementById(`charCount_${day}`);
            if (editor && counter) {
                counter.textContent = editor.value.length + ' karakter';
            }
        }

        function checkAnswer(day) {
            const item = curriculum.find(d => d.day === day);
            if (!item || !item.practice) return;

            const editor = document.getElementById(`editor_${day}`);
            const feedback = document.getElementById(`feedback_${day}`);
            const preview = document.getElementById(`preview_${day}`);

            const code = editor.value.trim();

            if (!code) {
                feedback.className = 'feedback-box error show';
                feedback.innerHTML = '<strong><i class="fas fa-exclamation-circle"></i> Kosong!</strong> Tulis dulu kode kamu sebelum memeriksa.';
                return;
            }

            const result = item.practice.validator(code);

            if (result.success) {
                feedback.className = 'feedback-box success show';
                feedback.innerHTML = `<strong><i class="fas fa-check-circle"></i> Berhasil!</strong> ${result.msg}`;
                // Render preview
                preview.innerHTML = code;
            } else {
                feedback.className = 'feedback-box error show';
                feedback.innerHTML = `<strong><i class="fas fa-times-circle"></i> Belum Tepat</strong> ${result.msg}<br><small>💡 Klik tombol <strong>Bantuan</strong> kalau bingung.</small>`;
                // Preview tetap tampil apa adanya untuk debugging
                preview.innerHTML = code;
            }
        }

        function showHint(day) {
            const item = curriculum.find(d => d.day === day);
            if (!item || !item.practice) return;

            const feedback = document.getElementById(`feedback_${day}`);
            feedback.className = 'feedback-box hint show';
            feedback.innerHTML = `<strong><i class="fas fa-lightbulb"></i> Petunjuk</strong> ${item.practice.hint}`;
        }

        function resetEditor(day) {
            const editor = document.getElementById(`editor_${day}`);
            const feedback = document.getElementById(`feedback_${day}`);
            const preview = document.getElementById(`preview_${day}`);
            if (editor) {
                editor.value = '';
                localStorage.removeItem(DRAFT_KEY + day);
                updateCharCount(day);
            }
            if (feedback) feedback.className = 'feedback-box';
            if (preview) preview.innerHTML = '<em style="color:#999;">Preview akan muncul di sini setelah kamu klik Periksa.</em>';
        }

        // ============================================================
        // EVENT LISTENERS
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            // Phase filter
            document.querySelectorAll('.phase-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.phase-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.getAttribute('data-phase');
                    render();
                });
            });

            // Theme toggle
            const themeToggle = document.getElementById('themeToggle');
            const savedTheme = localStorage.getItem('belajar_html_theme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark');
                themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
            }

            themeToggle.addEventListener('click', function() {
                document.body.classList.toggle('dark');
                const isDark = document.body.classList.contains('dark');
                this.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
                localStorage.setItem('belajar_html_theme', isDark ? 'dark' : 'light');
            });

            // Close modal
            document.getElementById('modalOverlay').addEventListener('click', function(e) {
                if (e.target === this) closeModal();
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closeModal();
            });

            // Tab key di editor → insert 2 spaces
            document.addEventListener('keydown', function(e) {
                if (e.target.classList && e.target.classList.contains('code-editor') && e.key === 'Tab') {
                    e.preventDefault();
                    const start = e.target.selectionStart;
                    const end = e.target.selectionEnd;
                    e.target.value = e.target.value.substring(0, start) + '  ' + e.target.value.substring(end);
                    e.target.selectionStart = e.target.selectionEnd = start + 2;
                }
            });

            render();
        });
    </script>
</body>
</html>
