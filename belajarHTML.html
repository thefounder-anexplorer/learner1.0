<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Belajar HTML Harian — 5 Menit Sehari, Mahir dalam 30 Hari</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        /* ===== RESET & ROOT ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #2c3e50;
            --secondary: #3498db;
            --accent: #1abc9c;
            --success: #2ecc71;
            --warning: #f39c12;
            --danger: #e74c3c;
            --purple: #9b59b6;
            --dark: #1a252f;
            --light: #ecf0f1;
            --bg: #f0f4f8;
            --card: #ffffff;
            --text: #2c3e50;
            --text-muted: #7f8c8d;
            --border: #e1e8ed;
            --gradient-1: linear-gradient(135deg, #2c3e50, #1a252f);
            --gradient-2: linear-gradient(135deg, #3498db, #2980b9);
            --gradient-3: linear-gradient(135deg, #1abc9c, #16a085);
            --gradient-4: linear-gradient(135deg, #9b59b6, #8e44ad);
            --gradient-5: linear-gradient(135deg, #f39c12, #e67e22);
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
            transition: background 0.3s, color 0.3s;
        }

        body.dark {
            --bg: #0f1720;
            --card: #1a2733;
            --text: #ecf0f1;
            --text-muted: #95a5a6;
            --border: #2c3e50;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ===== HEADER ===== */
        header {
            padding: 40px 30px;
            margin-bottom: 30px;
            background: var(--gradient-1);
            color: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(44, 62, 80, 0.3);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 350px;
            height: 350px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 50%;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: -40%;
            left: -10%;
            width: 250px;
            height: 250px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 50%;
        }

        header .back-link {
            position: absolute;
            top: 20px;
            left: 25px;
            color: #fff;
            font-size: 0.95rem;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.15);
            padding: 8px 16px;
            border-radius: 30px;
            transition: all 0.3s;
            backdrop-filter: blur(4px);
            z-index: 2;
        }

        header .back-link:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateX(-3px);
        }

        header .theme-toggle {
            position: absolute;
            top: 20px;
            right: 25px;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: #fff;
            padding: 10px 14px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 2;
            font-size: 1rem;
        }

        header .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(20deg);
        }

        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 1;
        }

        h1 i {
            margin-right: 12px;
            color: #f1c40f;
        }

        .subtitle {
            font-size: 1.15rem;
            opacity: 0.92;
            max-width: 700px;
            margin: 0 auto 18px;
            position: relative;
            z-index: 1;
        }

        /* ===== PROGRESS BAR GLOBAL ===== */
        .progress-wrapper {
            max-width: 600px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .progress-bar {
            background: rgba(255, 255, 255, 0.15);
            height: 12px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .progress-fill {
            background: linear-gradient(90deg, #2ecc71, #1abc9c);
            height: 100%;
            width: 0%;
            transition: width 0.5s ease;
            border-radius: 10px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-top: 8px;
            opacity: 0.9;
        }

        /* ===== STATS ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card);
            border-radius: 14px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-3px);
        }

        .stat-card .stat-icon {
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .stat-card .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--primary);
        }

        .stat-card .stat-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* ===== PHASE FILTER ===== */
        .phase-filter {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .phase-btn {
            padding: 10px 20px;
            border: 2px solid var(--border);
            background: var(--card);
            color: var(--text);
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .phase-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        .phase-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .phase-btn[data-phase="1"] { border-left: 4px solid #2ecc71; }
        .phase-btn[data-phase="2"] { border-left: 4px solid #3498db; }
        .phase-btn[data-phase="3"] { border-left: 4px solid #9b59b6; }
        .phase-btn[data-phase="4"] { border-left: 4px solid #e74c3c; }

        /* ===== DAY LIST ===== */
        .day-list {
            display: grid;
            gap: 14px;
            margin-bottom: 40px;
        }

        .day-card {
            background: var(--card);
            border-radius: 16px;
            padding: 20px 22px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
            border-left: 5px solid var(--secondary);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .day-card:hover {
            transform: translateX(4px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .day-card.completed {
            opacity: 0.7;
            border-left-color: var(--success);
            background: linear-gradient(to right, rgba(46, 204, 113, 0.05), var(--card));
        }

        .day-card.completed::after {
            content: '\f00c';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            top: 20px;
            right: 22px;
            color: var(--success);
            font-size: 1.4rem;
        }

        .day-card[data-phase="1"] { border-left-color: #2ecc71; }
        .day-card[data-phase="2"] { border-left-color: #3498db; }
        .day-card[data-phase="3"] { border-left-color: #9b59b6; }
        .day-card[data-phase="4"] { border-left-color: #e74c3c; }

        .day-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .day-number {
            background: var(--primary);
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.95rem;
            flex-shrink: 0;
        }

        .day-card.completed .day-number {
            background: var(--success);
        }

        .day-title {
            font-size: 1.15rem;
            font-weight: bold;
            color: var(--text);
        }

        .day-badge {
            font-size: 0.7rem;
            padding: 3px 12px;
            border-radius: 20px;
            font-weight: bold;
            margin-left: auto;
            white-space: nowrap;
        }

        .day-badge.phase-1 { background: #d5f5e3; color: #1e8449; }
        .day-badge.phase-2 { background: #d6eaf8; color: #1f618d; }
        .day-badge.phase-3 { background: #e8daef; color: #6c3483; }
        .day-badge.phase-4 { background: #fadbd8; color: #a93226; }

        body.dark .day-badge.phase-1 { background: #1e8449; color: #d5f5e3; }
        body.dark .day-badge.phase-2 { background: #1f618d; color: #d6eaf8; }
        body.dark .day-badge.phase-3 { background: #6c3483; color: #e8daef; }
        body.dark .day-badge.phase-4 { background: #a93226; color: #fadbd8; }

        .day-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .day-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 18px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--gradient-2);
            color: #fff;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(52, 152, 219, 0.3);
        }

        .btn-success {
            background: var(--gradient-3);
            color: #fff;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(26, 188, 156, 0.3);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text);
        }

        .btn-outline:hover {
            background: var(--light);
            transform: translateY(-2px);
        }

        body.dark .btn-outline:hover {
            background: #2c3e50;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--card);
            border-radius: 20px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--light);
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1rem;
            color: var(--text);
            transition: all 0.3s;
        }

        .modal-close:hover {
            background: var(--danger);
            color: #fff;
            transform: rotate(90deg);
        }

        .modal h2 {
            font-size: 1.6rem;
            color: var(--primary);
            margin-bottom: 8px;
        }

        body.dark .modal h2 {
            color: #fff;
        }

        .modal .modal-subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .modal h3 {
            font-size: 1.15rem;
            margin: 20px 0 10px;
            color: var(--secondary);
        }

        .modal p {
            font-size: 0.95rem;
            line-height: 1.7;
            margin-bottom: 12px;
            color: var(--text);
        }

        .modal ul {
            margin-left: 20px;
            margin-bottom: 15px;
        }

        .modal ul li {
            font-size: 0.95rem;
            line-height: 1.8;
            color: var(--text);
        }

        .code-block {
            background: #1e2a35;
            color: #ecf0f1;
            padding: 16px 20px;
            border-radius: 10px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 0.85rem;
            line-height: 1.6;
            overflow-x: auto;
            margin: 10px 0 15px;
            border-left: 4px solid var(--accent);
        }

        .code-block .tag { color: #e74c3c; }
        .code-block .attr { color: #f39c12; }
        .code-block .value { color: #2ecc71; }
        .code-block .comment { color: #7f8c8d; font-style: italic; }
        .code-block .keyword { color: #9b59b6; }
        .code-block .string { color: #1abc9c; }

        .preview-box {
            background: #fff;
            border: 2px dashed var(--border);
            border-radius: 10px;
            padding: 15px;
            margin: 10px 0 15px;
            color: #2c3e50;
        }

        .exercise-box {
            background: linear-gradient(135deg, #fff9e6, #fef5e7);
            border-left: 4px solid var(--warning);
            padding: 15px 20px;
            border-radius: 10px;
            margin: 15px 0;
        }

        body.dark .exercise-box {
            background: linear-gradient(135deg, #3d3416, #2c2510);
            color: #f1c40f;
        }

        .exercise-box strong {
            color: var(--warning);
        }

        /* ===== FOOTER ===== */
        footer {
            margin-top: 40px;
            padding: 30px;
            background: var(--primary);
            color: #fff;
            border-radius: 15px;
            text-align: center;
        }

        .footer-logo {
            font-size: 2.5rem;
            color: var(--accent);
            margin-bottom: 10px;
        }

        .footer-text {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .subtitle { font-size: 1rem; }
            header { padding: 30px 20px; }
            header .back-link,
            header .theme-toggle {
                position: relative;
                top: 0;
                left: 0;
                right: 0;
                margin: 0 5px 10px 0;
                display: inline-block;
            }
            .day-actions { flex-direction: column; }
            .day-actions .btn { width: 100%; justify-content: center; }
            .modal { padding: 22px 18px; }
            .day-badge { margin-left: 0; }
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.6rem; }
            .stat-card { padding: 15px; }
            .stat-card .stat-value { font-size: 1.4rem; }
        }

        /* ===== ANIMASI ===== */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .day-card {
            animation: fadeInUp 0.4s ease backwards;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: rgba(52, 152, 219, 0.4);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(52, 152, 219, 0.6);
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- ===== HEADER ===== -->
        <header>
            <a href="index.html" class="back-link">
                <i class="fas fa-arrow-left"></i> Portal
            </a>
            <button class="theme-toggle" id="themeToggle" title="Ganti Mode">
                <i class="fas fa-moon"></i>
            </button>

            <h1><i class="fas fa-code"></i> Belajar HTML Harian</h1>
            <p class="subtitle">5 Menit Sehari — Dari Pemula hingga Mahir dalam 30 Hari</p>

            <div class="progress-wrapper">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-label">
                    <span id="progressText">0 dari 30 hari selesai</span>
                    <span id="progressPercent">0%</span>
                </div>
            </div>
        </header>

        <!-- ===== STATS ===== -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">📅</div>
                <div class="stat-value" id="statDays">0</div>
                <div class="stat-label">Hari Selesai</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🔥</div>
                <div class="stat-value" id="statStreak">0</div>
                <div class="stat-label">Streak Beruntun</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⏱️</div>
                <div class="stat-value" id="statMinutes">0</div>
                <div class="stat-label">Menit Belajar</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🏆</div>
                <div class="stat-value" id="statLevel">Pemula</div>
                <div class="stat-label">Level Kamu</div>
            </div>
        </div>

        <!-- ===== PHASE FILTER ===== -->
        <div class="phase-filter">
            <button class="phase-btn active" data-phase="all">
                <i class="fas fa-layer-group"></i> Semua
            </button>
            <button class="phase-btn" data-phase="1">
                <i class="fas fa-seedling"></i> Fase 1 — Dasar
            </button>
            <button class="phase-btn" data-phase="2">
                <i class="fas fa-cubes"></i> Fase 2 — Struktur
            </button>
            <button class="phase-btn" data-phase="3">
                <i class="fas fa-palette"></i> Fase 3 — Styling
            </button>
            <button class="phase-btn" data-phase="4">
                <i class="fas fa-rocket"></i> Fase 4 — Interaktif
            </button>
        </div>

        <!-- ===== DAY LIST ===== -->
        <div class="day-list" id="dayList">
            <!-- Kartu hari akan di-generate oleh JavaScript -->
        </div>

        <!-- ===== FOOTER ===== -->
        <footer>
            <div class="footer-logo"><i class="fas fa-code"></i></div>
            <h3>Belajar HTML Harian</h3>
            <p class="footer-text">5 menit sehari, konsisten setiap hari, sampai kamu mahir. 💪</p>
        </footer>
    </div>

    <!-- ===== MODAL ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalContent">
            <!-- Konten modal di-generate JS -->
        </div>
    </div>

    <script>
        // ============================================================
        // KURIKULUM 30 HARI BELAJAR HTML
        // ============================================================
        const curriculum = [
            // ===== FASE 1: DASAR (Hari 1-7) =====
            {
                day: 1, phase: 1, title: "Pengenalan HTML & Struktur Dasar",
                desc: "Kenalan dengan HTML, cara kerja browser, dan struktur dasar halaman web.",
                material: `
                    <h3>Apa itu HTML?</h3>
                    <p>HTML (HyperText Markup Language) adalah bahasa yang digunakan untuk membuat struktur halaman web. Bayangkan HTML sebagai <em>kerangka</em> dari rumah — tanpa itu, rumah tidak berdiri.</p>
                    <h3>Struktur Dasar</h3>
                    <p>Setiap halaman HTML memiliki struktur dasar seperti ini:</p>
                    <div class="code-block">
<span class="tag">&lt;!DOCTYPE html&gt;</span>
<span class="tag">&lt;html&gt;</span>
<span class="tag">&lt;head&gt;</span>
    <span class="tag">&lt;title&gt;</span>Judul Halaman<span class="tag">&lt;/title&gt;</span>
<span class="tag">&lt;/head&gt;</span>
<span class="tag">&lt;body&gt;</span>
    <span class="comment">&lt;!-- Konten halaman di sini --&gt;</span>
<span class="tag">&lt;/body&gt;</span>
<span class="tag">&lt;/html&gt;</span>
                    </div>
                    <p>Setiap tag HTML memiliki pasangan buka dan tutup. Tag pembuka seperti <code>&lt;p&gt;</code>, tag penutup seperti <code>&lt;/p&gt;</code>.</p>
                    <div class="exercise-box">
                        <strong>💪 Latihan 5 Menit:</strong>
                        <p>Buat file <code>latihan.html</code>, tulis struktur dasar HTML, dan isi judul dengan namamu. Buka di browser dan lihat hasilnya.</p>
                    </div>
                `
            },
            {
                day: 2, phase: 1, title: "Tag Teks: Heading & Paragraf",
                desc: "Belajar tag heading (h1-h6) dan paragraf untuk menulis konten.",
                material: `
                    <h3>Tag Heading</h3>
                    <p>HTML memiliki 6 level heading, dari <code>&lt;h1&gt;</code> yang paling besar hingga <code>&lt;h6&gt;</code> yang paling kecil.</p>
                    <div class="code-block">
<span class="tag">&lt;h1&gt;</span>Judul Utama<span class="tag">&lt;/h1&gt;</span>
<span class="tag">&lt;h2&gt;</span>Sub Judul<span class="tag">&lt;/h2&gt;</span>
<span class="tag">&lt;h3&gt;</span>Sub Sub Judul<span class="tag">&lt;/h3&gt;</span>
                    </div>
                    <h3>Paragraf</h3>
                    <p>Tag <code>&lt;p&gt;</code> digunakan untuk membuat paragraf teks.</p>
                    <div class="code-block">
<span class="tag">&lt;p&gt;</span>Ini adalah paragraf pertama saya.<span class="tag">&lt;/p&gt;</span>
                    </div>
                    <div class="exercise-box">
                        <strong>💪 Latihan:</strong>
                        <p>Buat halaman dengan 1 heading utama (h1), 2 sub-heading (h2), dan 3 paragraf yang menceritakan hobi kamu.</p>
                    </div>
                `
            },
            {
                day: 3, phase: 1, title: "Memformat Teks: Bold, Italic, Underline",
                desc: "Gunakan tag formatting untuk menekankan teks penting.",

                    </div>
                    <h3>Arrow Function</h3>
                    <div class="code-block">

                        <strong>💪 Latihan:</strong>

                    </div>
                `
            },

            {
                day: 30, phase: 4, title: "Project Akhir: Aplikasi To-Do List",
                desc: "Gabungkan HTML, CSS, dan JavaScript menjadi aplikasi nyata.",
                material: `
                    <h3>Aplikasi To-Do List</h3>
                    <p>Kamu akan membuat aplikasi yang bisa:</p>
                    <ul>
                        <li>Menambah tugas baru</li>
                        <li>Menandai tugas sebagai selesai</li>
                        <li>Menghapus tugas</li>
                        <li>Menyimpan daftar di localStorage</li>
                        <li>Menampilkan statistik tugas</li>
                    </ul>
                    <div class="exercise-box">
                        <strong>🏆 Project Akhir:</strong>
                        <p>Buat file <code>todo.html</code> lengkap dengan HTML, CSS, dan JS. Ini adalah pencapaian besar — kamu sudah menyelesaikan 30 hari belajar!</p>
                    </div>
                `
            }

        // ============================================================
        // STATE & LOCALSTORAGE
        // ============================================================
        const STORAGE_KEY = 'belajar_html_progress';

        function loadProgress() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                return data ? JSON.parse(data) : { completedDays: [], lastVisit: null };
            } catch (e) {
                return { completedDays: [], lastVisit: null };
            }
        }

        function saveProgress(progress) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
            } catch (e) {
                console.warn('Gagal menyimpan progress:', e);
            }
        }

        let progress = loadProgress();
        let currentFilter = 'all';

        // ============================================================
        // RENDER
        // ============================================================
        function render() {
            renderDays();
            updateStats();
            updateProgressBar();
        }

        function renderDays() {
            const dayList = document.getElementById('dayList');
            dayList.innerHTML = '';

            const filtered = currentFilter === 'all'
                ? curriculum
                : curriculum.filter(d => d.phase === parseInt(currentFilter));

            filtered.forEach((item, index) => {
                const isCompleted = progress.completedDays.includes(item.day);
                const card = document.createElement('div');
                card.className = `day-card ${isCompleted ? 'completed' : ''}`;
                card.setAttribute('data-phase', item.phase);
                card.style.animationDelay = `${index * 0.05}s`;

                const phaseName = {
                    1: 'Pemula',
                    2: 'Menengah',
                    3: 'Mahir',
                    4: 'Expert'
                }[item.phase];

                card.innerHTML = `
                    <div class="day-header">
                        <div class="day-number">${item.day}</div>
                        <div class="day-title">${item.title}</div>
                        <span class="day-badge phase-${item.phase}">${phaseName}</span>
                    </div>
                    <div class="day-desc">${item.desc}</div>
                    <div class="day-actions">
                        <button class="btn btn-primary" onclick="openModal(${item.day})">
                            <i class="fas fa-book-open"></i> Pelajari (5 menit)
                        </button>
                        <button class="btn ${isCompleted ? 'btn-outline' : 'btn-success'}"
                                onclick="toggleComplete(${item.day})">
                            <i class="fas ${isCompleted ? 'fa-undo' : 'fa-check'}"></i>
                            ${isCompleted ? 'Batal Selesai' : 'Tandai Selesai'}
                        </button>
                    </div>
                `;
                dayList.appendChild(card);
            });
        }

        function updateStats() {
            const totalDays = curriculum.length;
            const completed = progress.completedDays.length;
            const minutes = completed * 5;

            document.getElementById('statDays').textContent = completed;
            document.getElementById('statMinutes').textContent = minutes;

            // Level
            let level = 'Pemula';
            if (completed >= 25) level = 'Expert';
            else if (completed >= 18) level = 'Mahir';
            else if (completed >= 10) level = 'Menengah';
            else if (completed >= 3) level = 'Pemula+';
            document.getElementById('statLevel').textContent = level;

            // Streak (sederhana: hitung hari selesai berturut-turut dari hari 1)
            let streak = 0;
            for (let i = 1; i <= totalDays; i++) {
                if (progress.completedDays.includes(i)) streak++;
                else break;
            }
            document.getElementById('statStreak').textContent = streak;
        }

        function updateProgressBar() {
            const total = curriculum.length;
            const completed = progress.completedDays.length;
            const percent = Math.round((completed / total) * 100);

            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('progressText').textContent = `${completed} dari ${total} hari selesai`;
            document.getElementById('progressPercent').textContent = percent + '%';
        }

        // ============================================================
        // ACTIONS
        // ============================================================
        function toggleComplete(day) {
            const idx = progress.completedDays.indexOf(day);
            if (idx === -1) {
                progress.completedDays.push(day);
                progress.lastVisit = new Date().toISOString();
            } else {
                progress.completedDays.splice(idx, 1);
            }
            progress.completedDays.sort((a, b) => a - b);
            saveProgress(progress);
            render();
        }

        function openModal(day) {
            const item = curriculum.find(d => d.day === day);
            if (!item) return;

            const modal = document.getElementById('modalContent');
            modal.innerHTML = `
                <button class="modal-close" onclick="closeModal()">
                    <i class="fas fa-times"></i>
                </button>
                <span class="day-badge phase-${item.phase}" style="margin-bottom:10px;display:inline-block;">
                    Hari ${item.day} — Fase ${item.phase}
                </span>
                <h2>${item.title}</h2>
                <p class="modal-subtitle">${item.desc}</p>
                <div class="modal-body">
                    ${item.material}
                </div>
                <div style="margin-top:20px;padding-top:20px;border-top:1px solid var(--border);display:flex;gap:10px;flex-wrap:wrap;">
                    <button class="btn btn-success" onclick="toggleComplete(${item.day}); closeModal();">
                        <i class="fas fa-check"></i> Tandai Selesai
                    </button>
                    <button class="btn btn-outline" onclick="closeModal()">
                        <i class="fas fa-times"></i> Tutup
                    </button>
                </div>
            `;

            document.getElementById('modalOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            document.body.style.overflow = '';
        }

        // ============================================================
        // EVENT LISTENERS
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            // Phase filter
            document.querySelectorAll('.phase-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.phase-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.getAttribute('data-phase');
                    render();
                });
            });

            // Theme toggle
            const themeToggle = document.getElementById('themeToggle');
            const savedTheme = localStorage.getItem('belajar_html_theme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark');
                themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
            }

            themeToggle.addEventListener('click', function() {
                document.body.classList.toggle('dark');
                const isDark = document.body.classList.contains('dark');
                this.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
                localStorage.setItem('belajar_html_theme', isDark ? 'dark' : 'light');
            });

            // Close modal
            document.getElementById('modalOverlay').addEventListener('click', function(e) {
                if (e.target === this) closeModal();
            });

            // ESC close
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closeModal();
            });

            // Initial render
            render();
        });
    </script>
</body>
